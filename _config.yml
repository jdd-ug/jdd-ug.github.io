timezone: Asia/Tokyo

collections:
  authors:
    output: true

# 著者を追加する場合は _authors/{short_name}.md を作成します。
# 実在する人物の情報へ置き換え、未設定の項目は省略してください。
#
# ---
# layout: author
# title: Staff
# short_name: new_member
# name: New Member
# position: Writer
# my_url: https://example.com/
# x_id: example_user
# image_url: /assets/images/authors/new_member.jpg
# ---
#
# ここから自己紹介を記載します。

defaults:
  - scope:
      path: ''
      type: 'authors'
    values:
      layout: 'author'
  - scope:
      path: ''
      type: 'posts'
    values:
      layout: 'post'
  - scope:
      path: ''
    values:
      layout: 'default'

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:categories/:year/:month/:day/
